<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#efe6d2;color:#141210;font:16px/1.5 system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:16px}h1,h2{font-family:Georgia,serif;text-transform:uppercase;margin:0}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:#141210;color:#efe6d2}
button,.b{min-height:46px;padding:0 18px;border:2px solid #141210;background:#fff;color:#141210;font:700 15px system-ui;cursor:pointer;display:inline-flex;align-items:center}
.r{background:#b32a17;color:#fff;border-color:#b32a17}.t[aria-pressed=true]{background:#141210;color:#efe6d2}
input,select,textarea{min-height:46px;border:2px solid #141210;padding:8px 10px;font:16px system-ui;width:100%;background:#fff;color:#141210}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.c{background:#f7f0df;border:2px solid #141210;padding:16px;display:flex;flex-direction:column;gap:6px}
.k{font:700 30px Georgia,serif}.s{font-size:13px;text-transform:uppercase;letter-spacing:.08em}table{width:100%;border-collapse:collapse;background:#f7f0df}td,th{border:2px solid #141210;padding:10px;text-align:left}</style></head>
<body><div class="bar"><h1 style="font-size:22px">Prince Tattoos · Admin</h1><button id="out">Sign out</button></div>
<div class="w" id="app" hidden>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px"><button class="t" data-t="m" aria-pressed="true">Photos &amp; videos</button><button class="t" data-t="b" aria-pressed="false">Bookings</button><button class="t" data-t="v" aria-pressed="false">Revenue</button></div>
<div id="p-m"><h2>Add to the gallery</h2>
<div class="c" style="margin:12px 0 20px"><label class="b r" for="file" style="justify-content:center">Choose photo or video</label>
<input id="file" type="file" accept="image/*,video/*" style="position:absolute;width:1px;height:1px;opacity:0"><div id="fn" class="s"></div>
<input id="title" placeholder="Title"><textarea id="desc" rows="3" placeholder="Description"></textarea><input id="price" inputmode="decimal" placeholder="Price"><button class="r" id="add">Upload &amp; publish</button><div id="ms" role="status" style="font-weight:700"></div></div>
<h2>Live in the gallery</h2><div id="ml" class="g" style="margin-top:12px"></div></div>
<div id="p-b" hidden><h2>Bookings</h2><div id="bl" style="display:flex;flex-direction:column;gap:12px;margin-top:12px"></div></div>
<div id="p-v" hidden><h2>Revenue</h2><div id="rv" style="margin-top:12px"></div></div></div>
<script type="module">
import {upload} from "https://esm.sh/@vercel/blob/client";
const $=i=>document.getElementById(i),esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});if(r.status===401){location.href="/#owner";throw 0}const j=await r.json();if(!r.ok)throw new Error(j.error||"Failed");return j}
$("out").onclick=async()=>{await fetch("/api/index?r=login",{method:"DELETE"});location.href="/#owner"};
let CUR="USD",media=[],books=[];
const money=n=>(+n||0).toFixed(2)+" "+CUR;
document.querySelectorAll(".t").forEach(b=>b.onclick=()=>{["m","b","v"].forEach(k=>$("p-"+k).hidden=k!==b.dataset.t);document.querySelectorAll(".t").forEach(c=>c.setAttribute("aria-pressed",c===b))});
$("file").onchange=()=>{$("fn").textContent=$("file").files[0]?$("file").files[0].name:""};
function drawM(){$("ml").innerHTML=media.length?media.map(m=>`<div class="c">${m.type==="video"?`<video src="${esc(m.url)}" controls playsinline preload="metadata" style="width:100%;aspect-ratio:4/5;object-fit:cover"></video>`:`<img src="${esc(m.url)}" alt="" style="width:100%;aspect-ratio:4/5;object-fit:cover">`}<b>${esc(m.title)}</b><span>${esc(m.desc)}</span><span>${m.price?esc(m.price)+" "+CUR:""}</span><button data-del="${m.id}">Delete</button></div>`).join(""):"Nothing yet."}
$("ml").onclick=async e=>{const id=e.target.dataset.del;if(!id)return;if(!e.target.dataset.s){e.target.dataset.s=1;e.target.textContent="Tap again to delete";return}await api("DELETE","/api/index?r=media&id="+id);load()};
$("add").onclick=async()=>{const f=$("file").files[0],t=$("title").value.trim(),ms=$("ms");if(!f||!t){ms.textContent="Choose a file and add a title.";return}
 ms.textContent="Uploading… keep this page open.";$("add").disabled=true;
 try{const pr=await fetch("/api/index?r=upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"blob.generate-client-token",payload:{pathname:f.name,clientPayload:null,multipart:false,callbackUrl:location.origin+"/api/index?r=upload"}})});
  if(!pr.ok){let pj={};try{pj=await pr.json()}catch(z){}throw new Error(pj.error||("server answered "+pr.status))}
  const bl=await upload(f.name,f,{access:"public",handleUploadUrl:"/api/index?r=upload",contentType:f.type});
  await api("POST","/api/index?r=media",{url:bl.url,type:f.type.startsWith("video")?"video":"image",title:t,desc:$("desc").value,price:$("price").value});
  ["file","title","desc","price"].forEach(i=>$(i).value="");$("fn").textContent="";ms.textContent="Published. Clients can see it now.";load()}
 catch(e){ms.textContent="Upload failed: "+(e&&e.message||"try again")}$("add").disabled=false};
const SO=["New","Confirmed","Completed","Cancelled"];
function drawB(){$("bl").innerHTML=books.length?books.map(b=>{const c=esc(b.contact),tel=/^[+\d\s()-]{7,}$/.test(b.contact)?`<a class="b" href="https://wa.me/${b.contact.replace(/\D/g,"")}" target="_blank" rel="noopener">WhatsApp</a> <a class="b" href="tel:${c}">Call</a>`:`<a class="b" href="mailto:${c}">Email</a>`;
 return `<div class="c"><b style="font-size:19px">${esc(b.name)}</b><span>${c}</span><span>${esc(b.placement)} · ${esc(b.style)} · ${esc(b.time)}</span><span><b>${b.dates.join(", ")}</b></span>${b.notes?`<span>${esc(b.notes)}</span>`:""}<span>${money(b.total)} · ${b.paid?`<b style="color:#1a7a3a">PAID${b.paidVia?" ("+b.paidVia+")":""}</b>`:"<b>Unpaid</b>"}</span>
 <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><select data-st="${b.id}" style="width:auto">${SO.map(o=>`<option${o===b.status?" selected":""}>${o}</option>`).join("")}</select><button data-pd="${b.id}">${b.paid?"Mark unpaid":"Mark paid"}</button>${tel}<button data-rm="${b.id}">Delete</button></div></div>`}).join(""):"No bookings yet."}
$("bl").onchange=async e=>{if(e.target.dataset.st){await api("PATCH","/api/index?r=bookings",{id:e.target.dataset.st,status:e.target.value});load()}};
$("bl").onclick=async e=>{const d=e.target.dataset;if(d.pd){const b=books.find(x=>x.id===d.pd);await api("PATCH","/api/index?r=bookings",{id:d.pd,paid:!b.paid});load()}
 if(d.rm){if(!d.s){e.target.dataset.s=1;e.target.textContent="Tap again to delete";return}await api("DELETE","/api/index?r=bookings&id="+d.rm);load()}};
function drawV(){const paid=books.filter(b=>b.paid),amt=b=>+b.paidAmount||+b.total||0,now=new Date(),mk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
 const tot=paid.reduce((s,b)=>s+amt(b),0),cur=mk(now),mo=paid.filter(b=>mk(b.paidAt||b.created)===cur).reduce((s,b)=>s+amt(b),0),pend=books.filter(b=>!b.paid&&b.status!=="Cancelled").reduce((s,b)=>s+(+b.total||0),0);
 const rows={};paid.forEach(b=>{const k=mk(b.paidAt||b.created);rows[k]=(rows[k]||{n:0,s:0});rows[k].n++;rows[k].s+=amt(b)});
 $("rv").innerHTML=`<div class="g"><div class="c"><span class="s">Total earned</span><span class="k">${money(tot)}</span></div><div class="c"><span class="s">This month</span><span class="k">${money(mo)}</span></div><div class="c"><span class="s">Pending deposits</span><span class="k">${money(pend)}</span></div><div class="c"><span class="s">Paid bookings</span><span class="k">${paid.length}</span></div></div>
 <h2 style="margin:24px 0 12px;font-size:20px">By month</h2><table><tr><th>Month</th><th>Paid bookings</th><th>Earned</th></tr>${Object.keys(rows).sort().reverse().map(k=>`<tr><td>${k}</td><td>${rows[k].n}</td><td>${money(rows[k].s)}</td></tr>`).join("")||"<tr><td colspan=3>No payments yet.</td></tr>"}</table>`}
function badge(){const n=books.filter(b=>b.status==="New").length;document.querySelector('[data-t="b"]').textContent="Bookings"+(n?" ("+n+" new)":"")}
async function load(){const[m,b]=await Promise.all([api("GET","/api/index?r=media"),api("GET","/api/index?r=bookings")]);media=m.items;CUR=m.currency||CUR;books=b;drawM();drawB();drawV();badge()}
setInterval(async()=>{if(document.hidden||$("app").hidden)return;try{books=await api("GET","/api/index?r=bookings");drawB();drawV();badge()}catch(e){}},20000);
(async()=>{try{await api("GET","/api/index?r=login");$("app").hidden=false;load()}catch(e){}})();
</script></body></html>
