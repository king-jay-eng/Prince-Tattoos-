<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141210;color:#efe6d2;font:17px/1.5 system-ui,sans-serif;padding:16px}
form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;border:3px solid #e3b93c;padding:28px}h1{margin:0;font:400 28px Georgia,serif;text-transform:uppercase}
input{min-height:50px;padding:0 12px;font-size:16px;border:2px solid #efe6d2;background:#fff;color:#141210}button{min-height:50px;border:0;background:#b32a17;color:#fff;font:700 16px system-ui;cursor:pointer}#m{color:#e3b93c;font-weight:700;min-height:24px}</style></head>
<body><form id="f"><h1>Prince Tattoos</h1><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button>Sign in</button><div id="m" role="status"></div></form>
<script>
document.getElementById("f").onsubmit=async function(e){e.preventDefault();var m=document.getElementById("m");m.textContent="Checking…";
try{var r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("p").value})});
if(r.ok){location.href="/admin"}else{var j=await r.json();m.textContent=j.error||"Sign in failed."}}catch(x){m.textContent="Couldn’t reach the server."}};
</script></body></html>
